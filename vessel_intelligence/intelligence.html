<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Satellite Intelligence</title>
<style>
:root{color-scheme:dark;--bg:#09121e;--card:#111f30;--line:#263c50;--ink:#e7eff8;--muted:#9eb1c7;--a:#64dfc1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui}header{padding:30px 4vw;border-bottom:1px solid var(--line);background:linear-gradient(100deg,#142e41,#101725)}h1{font-size:30px;margin:4px 0}h2{font-size:23px;margin:0 0 12px}h3{margin:0 0 12px}a{color:var(--a)}small,.muted{color:var(--muted)}.eyebrow{letter-spacing:3px;font-size:11px;color:var(--a)}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1800px;margin:auto}aside{padding:24px 15px;border-right:1px solid var(--line);min-height:90vh}aside button,aside a{display:block;width:100%;text-align:left;margin:5px 0;font-size:13px;text-decoration:none}main{padding:26px;min-width:0}button,input,select{border:1px solid var(--line);border-radius:7px;background:#172b3f;color:var(--ink);padding:9px 12px;font:inherit}button{cursor:pointer}button:hover,.active{border-color:var(--a);color:var(--a)}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.controls input{flex:1;min-width:140px}.card{padding:20px;border:1px solid var(--line);background:var(--card);border-radius:12px;margin-bottom:18px;min-width:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0}.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}.kpi strong{display:block;font-size:26px}.notice{padding:13px 17px;border-left:3px solid #e7b866;background:#292721;border-radius:6px;margin:16px 0}.table{overflow:auto;max-height:570px}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:11px;border-bottom:1px solid var(--line);text-align:left;min-width:100px;max-width:450px;overflow-wrap:anywhere}th{position:sticky;top:0;background:#203248;cursor:pointer}tbody tr:hover{background:#203248;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#09121e;padding:15px}dialog{max-width:1100px;width:94vw;max-height:90vh;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px}dialog::backdrop{background:#000b}.bar{display:grid;grid-template-columns:170px 1fr 90px;gap:12px;margin:9px 0;font-size:12px}.bar i{height:10px;background:var(--a);display:block;margin-top:6px}.badge{padding:3px 8px;background:#284636;color:var(--a);border-radius:4px;font-size:11px}.foot{display:flex;justify-content:space-between;margin-top:15px}.wrap{overflow-wrap:anywhere}svg{width:100%;height:230px}svg text{fill:#9eb1c7;font:11px system-ui}audio{max-width:100%}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{min-height:0;border-right:0;display:flex;flex-wrap:wrap}aside a,aside button{width:auto}.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}main{padding:15px}}
</style>
<header><div class="eyebrow">OFFLINE PCAP ANALYSIS / OBSERVED EVIDENCE</div><h1>Satellite Intelligence</h1><div id="meta" class="muted">Loading capture…</div></header>
<div class="layout"><aside><a href="/captures">← Capture files</a><div id="nav"></div><a id="vesselLink">Vessel profiles ↗</a><a id="contentLink">Content reconstruction ↗</a><p class="muted">Vessel sessions remain separate from satellite and terminal identities.</p></aside><main><div class="controls"><label>Scope <select id="scope"><option value="capture">Whole capture</option><option value="satellite">Satellite mapped traffic</option><option value="vessel">Selected vessel</option></select></label><select id="sat" aria-label="Select satellite"></select><select id="vessel" aria-label="Select vessel"></select><input id="search" placeholder="Search evidence on this page"><button id="refresh">Refresh</button></div><div id="content"></div></main></div>
<dialog id="detail"><button id="close" style="float:right">Close</button><h2>Observed evidence</h2><button id="copy">Copy evidence JSON</button><pre id="detailText"></pre></dialog>
<script>
const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),capture=new URLSearchParams(location.search).get('capture')||'',fmt=n=>Number(n||0).toLocaleString(),bytes=n=>{n=Number(n||0);let i=0;while(n>=1000&&i<4){n/=1000;i++}return n.toFixed(i?2:0)+' '+['B','KB','MB','GB','TB'][i]},dt=t=>t?new Date(Number(t)/1e6).toISOString().replace('T',' ').replace('Z',' UTC'):'Unknown';
let catalog,satellites,page='overview',offset=0,visible=[],activeProfile;
const pages={overview:'Capture overview',satellite:'Satellite profiles',telemetry:'Raw satellite telemetry',upload:'Upload / traffic behavior',stun:'STUN / TURN',ss7:'SS7 / Diameter / GTP',subscriber:'Subscriber / SMS evidence',voip:'VoIP / SIP / RTP',cctv:'CCTV / RTSP',desktop:'Advanced desktop tools'};
const params=()=>({capture,scope:$('scope').value,satellite:$('sat').value,vessel:$('vessel').value||0,kind:page,q:$('search').value,offset});
async function api(path,p={}){const r=await fetch(path+'?'+new URLSearchParams({capture,...p}));if(!r.ok)throw Error(await r.text());return r.json()}
function show(x){$('detailText').textContent=JSON.stringify(x,null,2);$('detail').showModal()}
function download(name,text,type='application/json'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function table(rows,columns){visible=rows;return '<div class="table"><table><thead><tr>'+columns.map(c=>'<th data-sort="'+esc(c)+'">'+esc(c.replaceAll('_',' '))+'</th>').join('')+'</tr></thead><tbody>'+rows.map((r,i)=>'<tr data-row="'+i+'">'+columns.map(c=>'<td>'+esc(typeof r[c]==='object'?JSON.stringify(r[c]):r[c])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'+(rows.length?'':'<p class="muted">No matching observed records. Missing evidence is not evidence of no activity.</p>')}
function wire(){document.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>show(visible[Number(b.dataset.row)]));document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{let col=b.dataset.sort,rs=visible.slice().sort((a,b)=>String(a[col]??'').localeCompare(String(b[col]??''),undefined,{numeric:true}));let cs=[...b.parentElement.children].map(x=>x.dataset.sort);b.closest('.table').outerHTML=table(rs,cs);wire()});if($('export'))$('export').onclick=()=>download('satellite-intelligence-'+page+'.json',JSON.stringify({source:catalog.meta.filename,sha256:catalog.meta.sha256,scope:params(),rows:visible},null,2))}
const bars=rows=>{let max=Math.max(1,...rows.map(r=>r.bytes));return rows.slice(0,12).map(r=>'<div class="bar"><span>'+esc(r.application||r.dst)+'</span><span><i style="width:'+100*r.bytes/max+'%"></i></span><span>'+bytes(r.bytes)+'</span></div>').join('')||'<p class="muted">No mapped packet data.</p>'};
function timeline(rs){if(!rs.length)return '<p>No mapped timestamps.</p>';let max=Math.max(1,...rs.map(r=>r.bytes)),n=Math.max(1,rs.length-1);return '<svg viewBox="0 0 900 220" role="img" aria-label="Mapped traffic timeline"><polyline fill="none" stroke="#64dfc1" stroke-width="2" points="'+rs.map((r,i)=>(30+840*i/n)+','+(180-150*r.bytes/max)).join(' ')+'"/><text x="30" y="212">'+esc(dt(rs[0].t))+'</text><text x="550" y="212">'+esc(dt(rs.at(-1).t))+'</text></svg>'}
async function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('content').innerHTML='<p>Loading observed evidence…</p>';try{
 if(page==='overview'){
  let s=catalog.meta.capture_stats||{};$('content').innerHTML='<h2>Capture overview</h2><div class="kpis">'+[['Packets',fmt(s.packets)],['Capture size',bytes(catalog.meta.size)],['Named satellites',satellites.filter(s=>s.id!=='unresolved').length],['Vessel/site candidates',catalog.vessels.length]].map(([k,v])=>'<div class="kpi"><strong>'+esc(v)+'</strong>'+esc(k)+'</div>').join('')+'</div><div class="notice">Satellite profiles use explicit names in producer telemetry. A terminal ID, NAS label or satellite capture filename is not a spacecraft identity. RF and orbital facts remain Unknown unless present in evidence.</div><div class="grid"><section class="card"><h3>Satellite inventory</h3>'+satellites.map(s=>'<p><button data-satellite="'+s.id+'">'+esc(s.name)+'</button> · '+s.sessions.length+' communication sessions</p>').join('')+'</section><section class="card"><h3>Analysis workspaces</h3><p>Use satellite profiles for capture-level telemetry, vessels for conservative RADIUS/session attribution, and protocol pages for decoded observations.</p><p>HTTP, images, video, email and validated SMS reconstruction remain available through the vessel dashboard, including its explicit whole-capture mode.</p><p>The original Python desktop dashboard is bundled for its complete upload/session workflows, SIP/SDP correlation, codec exports, CCTV and raw inspection tools.</p></section></div><section class="card"><h3>Capture protocol totals</h3>'+bars(catalog.capture_protocols.map(r=>({...r,application:r.protocol})))+'</section>';document.querySelectorAll('[data-satellite]').forEach(b=>b.onclick=()=>{$('sat').value=b.dataset.satellite;page='satellite';render()});return}
 if(page==='satellite'||page==='telemetry'){
  if(!$('sat').value){$('content').innerHTML='<h2>Satellite profiles</h2><p>No unambiguous satellite-name was found in the capture telemetry. Vessel profiles and protocol tools remain available.</p>';return}
  let p=await api('/api/satellite-profile',{satellite:$('sat').value});activeProfile=p;let s=p.satellite;
  if(page==='telemetry'){let rs=p.telemetry.filter(r=>JSON.stringify(r).toLowerCase().includes($('search').value.toLowerCase()));$('content').innerHTML='<h2>Satellite telemetry · '+esc(s.name)+'</h2><p>All matching producer records. Select a row for every raw field and original frame.</p><button id="export">Export telemetry JSON</button>'+table(rs,['frame','kind','comm','stream','terminal','direction','raw']);wire();return}
  $('content').innerHTML='<h2>'+esc(s.name)+'</h2><span class="badge">'+s.confidence+' · producer-reported identity</span><div class="kpis">'+[['Communication sessions',s.sessions.length],['Observed terminals',p.terminals.length],['Mapped packets',fmt(p.stats.packets)],['Mapped traffic',bytes(p.stats.bytes)]].map(([k,v])=>'<div class="kpi"><strong>'+esc(v)+'</strong>'+k+'</div>').join('')+'</div><div class="notice">'+esc(p.coverage)+'</div><div class="grid"><section class="card"><h3>Observed network identity</h3><p>Subnetworks: '+esc(s.subnetworks.join('; ')||'Unknown')+'</p><p>Frequency bands: '+esc(p.frequency_bands.join(', ')||'Unknown')+'</p><p>Spots: '+esc(p.spots.join(', ')||'Unknown')+'</p><p>Terminal IDs: '+esc(p.terminals.join(', ')||'Unknown')+'</p><p>Interfaces: '+esc(s.interfaces.join(', ')||'Unknown')+'</p><p>Orbital slot / NORAD ID / independently verified operator: Unknown</p><button id="profileEvidence">Profile evidence and raw terminal positions</button></section><section class="card"><h3>Mapped protocol distribution</h3>'+bars(p.protocols)+'</section></div><section class="card"><h3>Mapped traffic timeline · 10-second buckets</h3>'+timeline(p.timeline)+'</section><section class="card"><h3>Linked vessel / terminal observations</h3>'+p.mappings.map(m=>'<p><a href="/?'+new URLSearchParams({capture,vessel:m.vessel_id})+'">'+esc(m.vessel_name)+'</a> · terminal '+esc(m.terminal)+' · stream '+esc(m.stream)+' · '+esc(m.direction)+'</p>').join('')+'<p class="muted">Links are terminal-bearer candidates; individual subscribers remain distinct.</p></section><section class="card"><h3>Communication-session evidence</h3><button id="export">Export profile JSON</button>'+table(p.telemetry.filter(x=>x.kind==='communication-session'),['frame','comm','t_ns','raw'])+'</section>';$('profileEvidence').onclick=()=>show(p);wire();$('export').onclick=()=>download('satellite-profile.json',JSON.stringify({source:catalog.meta.filename,sha256:catalog.meta.sha256,...p},null,2));return}
 if(page==='desktop'){$('content').innerHTML='<h2>Advanced Python desktop workspace</h2><section class="card"><p>This is the original dashboard from “Diagnose satellite telemetry tab”, integrated into this installation. It retains Overview, Protocols, Upload Behavior, DNS, TLS, Sessions, HTTP, Files & Images, STUN, RADIUS, SS7, Subscriber Leaks, VoIP, CCTV, Satellite and Raw Data.</p><button id="openDesktop">Open full Python dashboard for this capture</button><p id="desktopStatus"></p><p>It opens on this computer with the capture path selected. Click Analyze in that window. Its analysis is capture-level and does not inherit the vessel selector. Pillow and matplotlib improve image/graph previews; FFmpeg is required for some codec/video conversions. The browser workspace requires none of those optional packages.</p><p class="notice">Desktop heuristic labels are analyst leads. They must not override the current vessel session evidence or turn encrypted/unknown content into confirmed activity.</p></section>';$('openDesktop').onclick=async()=>{let r=await fetch('/api/desktop?'+new URLSearchParams({capture}),{method:'POST',headers:{'X-Satellite-Action':'open-desktop'}});$('desktopStatus').textContent=r.ok?(await r.json()).status:await r.text()};return}
 if(page==='upload'){
  if(!$('vessel').value){$('content').innerHTML='<p>No vessel/session traffic mappings available. Full capture upload analysis is available in Advanced desktop tools.</p>';return}
  let r=await api('/api/table',{vessel:$('vessel').value,kind:'flows',limit:100,offset,q:$('search').value});$('content').innerHTML='<h2>Vessel traffic / upload behavior</h2><div class="notice">This view uses the selected vessel/session mappings, independent of the general scope selector. Byte imbalance is not proof of exfiltration. Use Advanced desktop tools for the original burst and logical-session workflow.</div><button id="export">Export page JSON</button>'+table(r.rows,Object.keys(r.rows[0]||{}).filter(k=>k!=='raw'))+pager(r.total);wire();wirePager(r.total);return}
 let r=await api('/api/intelligence',params());$('content').innerHTML='<h2>'+esc(pages[page])+'</h2><p>'+esc(r.status)+' · '+fmt(r.total)+' matching packet records</p><div class="notice">'+esc(r.interpretation||'This index is populated by the background worker.')+'</div>'+(page==='cctv'?'<p>RTSP records indicate streaming control, not necessarily CCTV. RTP alone is not labelled a camera. Use the original desktop tools for supported video extraction.</p>':'')+(page==='voip'?'<section class="card"><h3>G.711 audio streams</h3><p>PCMU/PCMA preview only; decoded samples are not verified speech. Up to 300 seconds from first observed media; timestamp discontinuities can stop a preview early. Missing timestamp intervals are silence, not recovered speech. Dynamic codecs and encrypted media remain metadata-only in this browser.</p>'+r.audio.map(a=>'<details><summary>'+esc(a.src+':'+a.sport+' → '+a.dst+':'+a.dport)+' · '+a.packets+' packets · '+((a.last_seen-a.first_seen)/1e9).toFixed(2)+' s observed span</summary><audio controls preload="none" src="/api/audio?'+esc(new URLSearchParams({...params(),stream:a.stream}))+'"></audio><p>SSRC '+esc(a.ssrc)+' · '+(a.pt===0?'PCMU':'PCMA')+'</p></details>').join('')+'</section>':'')+'<button id="export">Export current evidence page JSON</button>'+table(r.rows,['frame','t','src','sport','dst','dport','protocols','summary'])+pager(r.total);wire();wirePager(r.total);
 }catch(e){$('content').textContent=e.message}}
function pager(total){return '<div class="foot"><span>'+offset+'–'+Math.min(offset+100,total)+' of '+total+'</span><span><button id="prev">Previous</button> <button id="next">Next</button></span></div>'}
function wirePager(total){$('prev').disabled=offset===0;$('next').disabled=offset+100>=total;$('prev').onclick=()=>{offset=Math.max(0,offset-100);render()};$('next').onclick=()=>{offset+=100;render()}}
async function init(){try{[catalog,satellites]=await Promise.all([api('/api/catalog'),api('/api/satellites')]);$('meta').textContent=catalog.meta.filename+' · '+bytes(catalog.meta.size)+' · '+dt(catalog.meta.capture_start_ns)+' → '+dt(catalog.meta.capture_end_ns);$('sat').innerHTML=satellites.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('')||'<option value="">Satellite unknown</option>';$('vessel').innerHTML=catalog.vessels.map(v=>'<option value="'+v.id+'">'+esc(v.name)+'</option>').join('')||'<option value="">No vessel identity</option>';$('nav').innerHTML=Object.entries(pages).map(([k,v])=>'<button data-page="'+k+'">'+v+'</button>').join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;offset=0;render()});$('vesselLink').href='/?capture='+encodeURIComponent(capture);$('contentLink').href='/?capture='+encodeURIComponent(capture)+'&tab=reconstruction';render()}catch(e){$('content').textContent=e.message}}
$('close').onclick=()=>$('detail').close();$('copy').onclick=()=>navigator.clipboard.writeText($('detailText').textContent);$('refresh').onclick=()=>{offset=0;render()};for(let id of ['scope','sat','vessel'])$(id).onchange=()=>{offset=0;render()};$('search').onkeydown=e=>{if(e.key==='Enter'){offset=0;render()}};init();
</script></html>
